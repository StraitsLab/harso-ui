name: map-style

# Applies design/google-map-style*.json to the Google card map styles (dev + prod) after merge.
# Keyless: GitHub proves this repo + main to Google (Workload Identity Federation); the map robot
# can only manage map styles. Run by hand from Actions with dry=true to compare without writing.
on:
  push:
    branches: [main]
    paths: ["design/google-map-style.json", "design/google-map-style.dark.json", "scripts/map-style-sync.mjs"]
  workflow_dispatch:
    inputs:
      dry: { description: "Compare only, write nothing", type: boolean, default: true }

permissions:
  contents: read
  id-token: write

concurrency: { group: map-style, cancel-in-progress: false }

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/650999278076/locations/global/workloadIdentityPools/github/providers/harso-ui
          service_account: map-style-robot@cs-project-hqxdlqul.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
      - run: node scripts/map-style-sync.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '--dry' || '' }}
        env:
          GOOGLE_TOKEN: ${{ steps.google.outputs.access_token }}
